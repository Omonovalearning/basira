<script>const SB_URL="https://yteicgsqfpzexvkllhec.supabase.co";const SB_KEY="sb_publishable_uJW4I-RH_MzzHNv20eBhPA_qZymgSVP";const STATIC_ID="5";const STATIC_TITLE="Blockchain: The Impenetrable Digital Database";const STATIC_TITLE_AR="";const STATIC_CONTENT="<h1>Blockchain: The Impenetrable Digital Database</h1>\n\n<h2>What is Blockchain Technology?</h2>\n<p>A blockchain is a highly secure, distributed digital database that records information in a way that makes it nearly impossible to hack, alter, or cheat the system. Unlike traditional databases stored on a single central server controlled by one entity, blockchain distributes and duplicates its data across a massive global network of computers. This collective distribution ensures unparalleled transparency, as every participant in the network holds an identical copy of the records, completely eliminating the need for a central authority or middleman.</p>\n\n<h2>The Mechanics: How It Works</h2>\n<p>The technology operates by collecting recent data into groups known as \"blocks.\" Each block has a specific storage capacity, and once it is filled with information, it is securely closed and linked to the previously filled block, forming a continuous chronological \"chain.\" What makes this process extraordinary is that every new block contains a unique cryptographic hash—a digital fingerprint—of the block before it, along with a precise timestamp and transaction data. This cryptographic hash acts as a complex security seal that binds the blocks tightly together.</p>\n\n<h2>The Shield of Immutability</h2>\n<p>The true power of blockchain lies in this incredible cryptographic linkage. If someone attempts to tamper with the data inside an older block, the cryptographic hash of that block will instantly change. Since the subsequent block relies on the original hash, this alteration will immediately break the entire chain and alert the network. To successfully alter a past record, a hacker would need to simultaneously recalculate the hashes for all subsequent blocks across every computer on the network, which is practically and technically impossible.</p>";const STATIC_CONTENT_AR="";const STATIC_SOURCES=[{"url":"https://www.ibm.com/topics/what-is-blockchain","title":"IBM: What is Blockchain Technology?"},{"url":"https://aws.amazon.com/what-is/blockchain/","title":"Amazon Web Services (AWS): What is Blockchain?"},{"url":"https://www.investopedia.com/terms/b/blockchain.asp","title":"Investopedia: Blockchain Facts: What Is It, How It Works, and How It Can Be Used"}];let articleLang="en",userReaction=null;let articleData={id:STATIC_ID,title:STATIC_TITLE,title_ar:STATIC_TITLE_AR,content:STATIC_CONTENT,content_ar:STATIC_CONTENT_AR,sources:STATIC_SOURCES};let currentArticle=articleData;function getArticleId(){return STATIC_ID;}function getSessionId(){let s=localStorage.getItem("basira-session");if(!s){s="sid_"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("basira-session",s);}return s;}function sanitize(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}async function trackView(id){const key="basira-viewed-"+id;if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,"1");await sbPost("views",{article_id:id});}async function sbGet(path){try{const r=await fetch(SB_URL+"/rest/v1/"+path,{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});return r.ok?r.json():null;}catch(e){return null;}}async function sbPost(t,d){try{const r=await fetch(SB_URL+"/rest/v1/"+t,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(d)});return r.ok?r.json():null;}catch(e){return null;}}async function sbDelete(path){try{const r=await fetch(SB_URL+"/rest/v1/"+path,{method:"DELETE",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});return r.ok;}catch(e){return false;}}async function loadComments(){const id=getArticleId(),sid=getSessionId(),data=await sbGet("comments?article_id=eq."+id+"&order=created_at.desc"),list=document.getElementById("comments-list");if(!list)return;const count=(data||[]).length,badge=document.getElementById("comments-count-badge");if(badge){if(count>0){badge.textContent="("+count+")";badge.classList.remove("hidden");badge.classList.add("flex");}else{badge.classList.add("hidden");badge.classList.remove("flex");}}if(!data||!data.length){list.innerHTML="<p class=\"text-[12px] dark:text-platinum/25 text-obsidian-400 pb-2\">No comments yet. Be the first!</p>";return;}list.innerHTML=data.map(function(c){const own=c.session_id===sid;const db=own?"<button onclick=\"deleteComment("+JSON.stringify(c.id)+")\" class=\"ml-auto flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10px] font-medium dark:text-platinum/30 text-obsidian-400 hover:dark:text-red-400 hover:text-red-500 hover:dark:bg-red-500/10 hover:bg-red-500/5 border dark:border-white/[0.04] border-obsidian-800/[0.04] transition-all duration-200\"><i data-lucide=\"trash-2\" class=\"w-3 h-3\"></i>Delete</button>":"";return "<div class=\"p-4 rounded-xl dark:bg-white/[0.03] bg-obsidian-800/[0.03] border dark:border-white/[0.06] border-obsidian-800/[0.06]\"><div class=\"flex items-center gap-2 mb-2\"><div class=\"w-7 h-7 rounded-full dark:bg-platinum/10 bg-obsidian-800/5 flex items-center justify-center text-[11px] font-semibold dark:text-platinum/60 text-obsidian-500\">"+(sanitize(c.author||"?")[0].toUpperCase())+"</div><span class=\"text-[12px] font-medium dark:text-platinum/60 text-obsidian-500\">"+sanitize(c.author||"?")+"</span><span class=\"text-[10px] font-medium px-2 py-0.5 rounded-md dark:bg-white/[0.04] bg-obsidian-800/[0.03] dark:text-platinum/30 text-obsidian-400\">"+new Date(c.created_at).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+"</span>"+db+"</div><p class=\"text-[13px] dark:text-platinum/70 text-obsidian-600 leading-relaxed\">"+sanitize(c.content)+"</p></div>";}).join("");if(window.lucide)lucide.createIcons({nodes:[list]});}function toggleComment(){const box=document.getElementById("comment-area");box.classList.toggle("open");if(!box.classList.contains("open")){const p=document.getElementById("add-comment-panel");if(p)p.classList.remove("open");}}function toggleAddComment(){const panel=document.getElementById("add-comment-panel");panel.classList.toggle("open");if(panel.classList.contains("open"))setTimeout(function(){document.getElementById("comment-name").focus();},50);}async function submitComment(){const input=document.getElementById("comment-input"),nameEl=document.getElementById("comment-name"),text=input.value.trim(),author=nameEl?nameEl.value.trim():"";if(!author){nameEl.style.borderColor="rgba(239,68,68,0.6)";nameEl.focus();showToast("Please enter your name","alert-circle");setTimeout(function(){nameEl.style.borderColor="";},2000);return;}if(!text){showToast("Please write something first","alert-circle");return;}const result=await sbPost("comments",{article_id:String(getArticleId()),content:text,author:author,session_id:getSessionId()});if(result){input.value="";nameEl.value="";document.getElementById("add-comment-panel").classList.remove("open");loadComments();showToast("Comment posted!","check-circle");}else showToast("Error posting comment","alert-circle");}async function deleteComment(id){if(!confirm("Delete your comment?"))return;const ok=await sbDelete("comments?id=eq."+id+"&session_id=eq."+getSessionId());if(ok){loadComments();showToast("Comment deleted","trash-2");}else showToast("Could not delete","alert-circle");}async function loadReactions(){const id=getArticleId(),data=await sbGet("reactions?article_id=eq."+id+"&select=type");if(data){document.getElementById("like-count").textContent=data.filter(function(r){return r.type==="like";}).length;document.getElementById("dislike-count").textContent=data.filter(function(r){return r.type==="dislike";}).length;}const saved=localStorage.getItem("basira-reaction-"+id);if(saved){userReaction=saved;document.getElementById("btn-like").classList.toggle("liked",saved==="like");document.getElementById("btn-dislike").classList.toggle("disliked",saved==="dislike");}}async function react(type){const id=String(getArticleId()),k="basira-reaction-"+id,prev=localStorage.getItem(k);if(prev===type){try{await fetch(SB_URL+"/rest/v1/reactions?article_id=eq."+id+"&type=eq."+type,{method:"DELETE",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});}catch(e){}userReaction=null;document.getElementById("btn-like").classList.remove("liked");document.getElementById("btn-dislike").classList.remove("disliked");localStorage.removeItem(k);showToast("Reaction removed","minus-circle");}else{if(prev){try{await fetch(SB_URL+"/rest/v1/reactions?article_id=eq."+id+"&type=eq."+prev,{method:"DELETE",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});}catch(e){}}userReaction=type;document.getElementById("btn-like").classList.toggle("liked",type==="like");document.getElementById("btn-dislike").classList.toggle("disliked",type==="dislike");localStorage.setItem(k,type);await sbPost("reactions",{article_id:id,type:type,session_id:getSessionId()});showToast(type==="like"?"Thanks!":"Feedback noted",type==="like"?"heart":"frown");}loadReactions();}function openSources(){const sources=STATIC_SOURCES,list=document.getElementById("sources-list");if(!list)return;if(!sources||!sources.length){list.innerHTML="<p class=\"text-[13px] dark:text-platinum/40 text-obsidian-500\">No sources listed.</p>";}else{list.innerHTML=sources.map(function(s,i){return "<a href="+JSON.stringify(s.url)+" target=\"_blank\" rel=\"noopener noreferrer\" class=\"flex items-start gap-3 p-4 rounded-xl dark:bg-white/[0.03] bg-obsidian-800/[0.03] border dark:border-white/[0.06] border-obsidian-800/[0.06] hover:dark:bg-white/[0.06] hover:bg-obsidian-800/[0.06] transition-all duration-200 group\"><span class=\"flex-shrink-0 w-6 h-6 rounded-md dark:bg-platinum/10 bg-obsidian-800/5 flex items-center justify-center text-[10px] font-bold dark:text-platinum/60 text-obsidian-500\">"+( i+1)+"</span><div><p class=\"text-[13px] font-medium dark:text-platinum/80 text-obsidian-700 group-hover:dark:text-white transition-colors\">"+s.title+"</p><p class=\"text-[11px] dark:text-platinum/30 text-obsidian-400 mt-0.5 break-all\">"+s.url+"</p></div></a>";}).join("");}document.getElementById("sources-modal").classList.remove("hidden");}function closeSources(e){if(e.target.id==="sources-modal")document.getElementById("sources-modal").classList.add("hidden");}function shareArticle(p){const u="https://basira.top/articles/blockchain-the-impenetrable-digital-database.html",t=STATIC_TITLE;if(p==="copy")navigator.clipboard.writeText(u).then(function(){showToast("Link copied!","check-circle");});else if(p==="whatsapp")window.open("https://wa.me/?text="+encodeURIComponent(t+"\n"+u),"_blank");}async function loadRelated(){const cat="tech",id=STATIC_ID,section=document.getElementById("related-section"),grid=document.getElementById("related-grid");if(!section||!grid)return;const data=await sbGet("articles?category=eq."+cat+"&status=eq.published&id=neq."+id);if(!data||!data.length){section.classList.add("hidden");return;}function sl(t){return(t||"").toLowerCase().replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").replace(/-+/g,"-").substring(0,60)||"article";}const nonSelf=data.filter(function(x){return String(x.id)!==String(id);}).slice(0,3);if(!nonSelf.length){section.classList.add("hidden");return;}section.classList.remove("hidden");grid.innerHTML=nonSelf.map(function(x){return "<a href=\"/articles/"+sl(x.title)+".html\" class=\"group flex gap-4 p-4 rounded-xl dark:bg-white/[0.03] bg-obsidian-800/[0.03] border dark:border-white/[0.06] border-obsidian-800/[0.06] hover:dark:bg-white/[0.06] hover:bg-obsidian-800/[0.06] transition-all duration-200\"><div class=\"w-16 h-16 rounded-lg overflow-hidden flex-shrink-0 dark:bg-obsidian-700 bg-gray-100\"><img src=\""+( x.image||"")+"\" alt=\""+x.title+"\" class=\"w-full h-full object-cover dark:brightness-75\"></div><div class=\"flex-1 min-w-0\"><span class=\"text-[9px] tracking-widest uppercase dark:text-platinum/40 text-obsidian-400\">"+x.category+"</span><p class=\"text-[13px] font-semibold dark:text-platinum/80 text-obsidian-700 mt-0.5 line-clamp-2 group-hover:dark:text-white transition-colors\">"+x.title+"</p></div></a>";}).join("");}function toggleLanguage(){const html=document.documentElement,btn=document.getElementById("langBtn");if(btn.textContent.trim()==="العربية"){html.setAttribute("dir","rtl");html.setAttribute("lang","ar");btn.textContent="English";showToast("تم التبديل إلى العربية","languages");}else{html.setAttribute("dir","ltr");html.setAttribute("lang","en");btn.textContent="العربية";showToast("Switched to English","languages");}}function toggleTheme(){const html=document.documentElement,thumb=document.querySelector(".toggle-thumb");html.classList.add("theme-transition");if(html.classList.contains("dark")){html.classList.remove("dark");thumb.classList.replace("translate-x-[24px]","translate-x-0");localStorage.setItem("basira-theme","light");showToast("Light mode","sun");}else{html.classList.add("dark");thumb.classList.replace("translate-x-0","translate-x-[24px]");localStorage.setItem("basira-theme","dark");showToast("Dark mode","moon");}setTimeout(function(){lucide.createIcons();},60);setTimeout(function(){html.classList.remove("theme-transition");},600);}function toggleMobile(){const menu=document.getElementById("mobile-menu"),btn=document.getElementById("mobile-btn"),isOpen=!menu.classList.contains("hidden");menu.classList.toggle("hidden");btn.innerHTML=isOpen?"<i data-lucide=\"menu\" class=\"w-5 h-5 dark:text-platinum/60 text-obsidian-500\"></i>":"<i data-lucide=\"x\" class=\"w-5 h-5 dark:text-platinum/60 text-obsidian-500\"></i>";lucide.createIcons({nodes:[btn]});}function showToast(msg,icon){const box=document.getElementById("toast-box"),t=document.createElement("div");t.className="toast-in pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-xl dark:bg-obsidian-700/90 bg-white/90 header-blur shadow-2xl border dark:border-white/[0.06] border-obsidian-800/[0.06] min-w-[220px]";t.innerHTML="<div class=\"w-6 h-6 rounded-md dark:bg-platinum/10 bg-obsidian-800/5 flex items-center justify-center flex-shrink-0\"><i data-lucide=\""+icon+"\" class=\"w-3 h-3 dark:text-platinum/70 text-obsidian-600\"></i></div><span class=\"text-[12px] font-medium dark:text-platinum/80 text-obsidian-700\">"+msg+"</span>";box.appendChild(t);lucide.createIcons({nodes:[t]});setTimeout(function(){t.classList.replace("toast-in","toast-out");setTimeout(function(){t.remove();},300);},2200);}function initProgressBar(){const bar=document.getElementById("read-progress");if(!bar)return;window.addEventListener("scroll",function(){const doc=document.documentElement;bar.style.width=Math.min(100,(doc.scrollTop/(doc.scrollHeight-doc.clientHeight))*100)+"%";});}document.addEventListener("DOMContentLoaded",function(){if(localStorage.getItem("basira-theme")==="light"){document.documentElement.classList.remove("dark");const t=document.querySelector(".toggle-thumb");if(t){t.classList.remove("translate-x-[24px]");t.classList.add("translate-x-0");}}const artEl=document.getElementById("article-content");if(STATIC_CONTENT&&STATIC_CONTENT.trim()!==""){artEl.innerHTML=STATIC_CONTENT;}else{artEl.innerHTML="<p style=\"opacity:.5\">Loading...</p>";sbGet("articles?id=eq."+STATIC_ID+"&select=content").then(function(d){if(d&&d[0]&&d[0].content){artEl.innerHTML=d[0].content;}else{artEl.innerHTML="<p style=\"opacity:.5\">Content not available.</p>";}});}initProgressBar();loadReactions();loadComments();loadRelated();trackView(STATIC_ID);lucide.createIcons();setTimeout(function(){document.querySelectorAll(".anim-fade").forEach(function(el){el.classList.add("visible");});},200);window.addEventListener("scroll",function(){const btn=document.getElementById("back-to-top");if(btn)btn.classList.toggle("visible",window.scrollY>400);});});</script>
