  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .dark ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #CCC; border-radius: 10px; }
    .theme-transition, .theme-transition *, .theme-transition *::before, .theme-transition *::after {
      transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease !important;
    }
    .header-blur { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-fade { opacity: 0; transform: translateY(40px); }
    .anim-fade.visible { animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-delay-1 { animation-delay: 0.1s !important; }
    .anim-delay-2 { animation-delay: 0.25s !important; }
    .toggle-track { transition: background-color 0.3s ease; }
    .toggle-thumb { transition: transform 0.35s cubic-bezier(0.68, -0.3, 0.32, 1.3); }
    @keyframes toastSlideIn { from { transform: translateY(-16px) scale(0.96); opacity:0; } to { transform: translateY(0) scale(1); opacity:1; } }
    @keyframes toastSlideOut { from { transform: translateY(0) scale(1); opacity:1; } to { transform: translateY(-16px) scale(0.96); opacity:0; } }
    .toast-in { animation: toastSlideIn 0.35s cubic-bezier(0.16,1,0.3,1) forwards; }
    .toast-out { animation: toastSlideOut 0.25s ease-in forwards; }
    .article-content { line-height: 1.9; }
    .article-content h2 { margin-top: 2rem; margin-bottom: 1rem; font-weight: 600; font-size: 1.5rem; }
    .article-content p { margin-bottom: 1rem; }
    .article-content img { border-radius: 1rem; margin: 2rem 0; }
    /* Back to top */
    #back-to-top { opacity:0; transform:translateY(10px); transition:all 0.3s ease; pointer-events:none; }
    #back-to-top.visible { opacity:1; transform:translateY(0); pointer-events:auto; }
    /* TOC */
    .toc-link { transition: all 0.2s ease; }
    .toc-link.active { color: #C0C0C0 !important; padding-right: 0.5rem; border-right: 2px solid #C0C0C0; }
    /* Reaction buttons */
    .reaction-btn { transition: all 0.2s ease; }
    .reaction-btn.liked { color:#22c55e!important; border-color:#22c55e!important; }
    .reaction-btn.disliked { color:#ef4444!important; border-color:#ef4444!important; }
    /* Comment area */
    .comment-area { display:none; }
    .comment-area.open { display:block; }
    /* Sources modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:300; display:flex; align-items:center; justify-content:center; padding:1rem; }
  </style>

      1: { title: 'What is Quantum Physics?', category: 'science', date: 'May 14, 2025', readTime: '5 min', image: 'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80', content: `<h2>Why is Quantum Physics Different?</h2>
<p>Quantum physics is the study of how the smallest particles in the universe behave. Unlike classical physics that describes objects we can see, quantum physics operates at the scale of atoms and subatomic particles where the rules are completely different.</p>

<h2>The Uncertainty Principle</h2>
<p>One of the most famous concepts in quantum physics is Heisenberg's Uncertainty Principle. It states that we cannot simultaneously know both the exact position and exact momentum of a particle. The more precisely we measure one, the less precisely we know the other. Think of it like trying to photograph a moving car - the faster it moves, the blurrier it appears.</p>

<h2>Superposition: Being in Two Places at Once</h2>
<p>In quantum mechanics, particles can exist in multiple states at the same time - this is called superposition. A particle can be spinning up AND down simultaneously until we measure it. This isn't magic; it's how nature works at the smallest scales.</p>

<h2>Real-World Applications</h2>
<p>Quantum physics isn't just theoretical. It powers modern technology like computers, lasers, solar panels, and medical imaging devices. Without understanding quantum mechanics, we wouldn't have the technology we rely on today.</p>` },
      2: { title: 'DNA: The Blueprint of Life', category: 'science', date: 'May 13, 2025', readTime: '6 min', image: 'https://images.unsplash.com/photo-1628595351029-c2bf17511435?w=900&q=80', content: `<h2>What is DNA?</h2>
<p>DNA (Deoxyribonucleic Acid) is a molecule that carries the genetic instructions for life. It's like a recipe book that tells your cells how to build and maintain your body. Every living organism - from bacteria to humans - uses DNA to store genetic information.</p>

<h2>The Double Helix Structure</h2>
<p>DNA has a famous double helix shape, discovered by Watson and Crick. Imagine a twisted ladder where the sides are made of sugar and phosphate molecules, and the rungs are made of bases (A, T, G, C). This elegant structure allows DNA to store information and replicate itself.</p>

<h2>How DNA Works</h2>
<p>DNA contains instructions called genes. Each gene tells your cells how to make specific proteins. These proteins do almost everything in your body - they build muscles, fight diseases, digest food, and create enzymes. Your genes are the reason you might have your mother's eyes or your father's height.</p>

<h2>DNA and Inheritance</h2>
<p>You inherit DNA from both your parents. Half comes from your mother and half from your father. This mix creates your unique genetic code. This is why children resemble their parents but aren't identical to them.</p>` },
      3: { title: 'Black Holes: Cosmic Mysteries Explained', category: 'science', date: 'May 12, 2025', readTime: '7 min', image: 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=900&q=80', content: `<h2>What is a Black Hole?</h2>
<p>A black hole is a region in space where gravity is so strong that nothing - not even light - can escape once it crosses a certain boundary called the event horizon. Black holes form when massive stars collapse at the end of their lives.</p>

<h2>How Black Holes Form</h2>
<p>When a very large star (at least 20 times the mass of our Sun) runs out of fuel, it collapses inward. The pressure and temperature become so extreme that the star's core compresses into an incredibly tiny point. This creates the black hole.</p>

<h2>The Event Horizon</h2>
<p>The event horizon is the "point of no return" around a black hole. Once anything crosses it, it can never escape - gravity pulls everything toward the singularity at the center. This is why we call it a black hole: no light escapes, so it looks completely black.</p>

<h2>Types of Black Holes</h2>
<p>Scientists have discovered several types: stellar black holes (formed from dead stars), supermassive black holes (found at the centers of galaxies), and intermediate black holes. Our galaxy's center contains a supermassive black hole millions of times heavier than the Sun.</p>` },
      4: { title: 'Artificial Intelligence: How Machines Think', category: 'tech', date: 'May 11, 2025', readTime: '8 min', image: 'https://images.unsplash.com/photo-1677442135703-1787eea5ce01?w=900&q=80', content: `<h2>What is Artificial Intelligence?</h2>
<p>Artificial Intelligence (AI) refers to computer systems designed to perform tasks that typically require human intelligence. These include learning from experience, recognizing patterns, understanding language, and making decisions.</p>

<h2>Machine Learning Basics</h2>
<p>Machine learning is a type of AI where computers learn from data instead of being explicitly programmed. For example, a computer can be trained to recognize cats by analyzing thousands of cat images. It learns what features make something a cat - without someone telling it what those features are.</p>

<h2>Neural Networks</h2>
<p>Neural networks are inspired by how our brains work. They consist of interconnected nodes (like neurons) that process information. When you show a neural network a handwritten number, it adjusts connections between nodes until it learns to recognize all digits accurately.</p>

<h2>Real-World AI Applications</h2>
<p>AI powers recommendation systems (Netflix suggestions), virtual assistants (Siri, Alexa), facial recognition, medical diagnosis tools, and self-driving cars. AI can now beat humans at chess, generate human-like text, and even create art.</p>

<h2>The Future of AI</h2>
<p>As AI improves, it will transform healthcare, education, transportation, and countless other fields. However, it also raises important questions about privacy, bias, and job displacement that society needs to address.</p>` },
      5: { title: 'Blockchain: The Technology Behind Bitcoin', category: 'tech', date: 'May 10, 2025', readTime: '6 min', image: 'https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=900&q=80', content: `<h2>What is Blockchain?</h2>
<p>Blockchain is a technology that records transactions in a way that's secure, transparent, and impossible to cheat. Imagine a notebook that everyone in a network has a copy of. When someone makes a transaction, everyone updates their copy simultaneously.</p>

<h2>How Blocks Work</h2>
<p>A blockchain is a chain of "blocks" (like pages in a notebook). Each block contains transaction data. When a block is full, it's sealed with a unique code called a hash. The next block references the previous block's hash, creating an unbreakable chain.</p>

<h2>Decentralization</h2>
<p>Unlike traditional banking where one institution controls records, blockchain is decentralized. No single person or company controls it. Instead, many computers (called nodes) maintain copies of the entire chain, making fraud nearly impossible.</p>

<h2>Cryptocurrency</h2>
<p>Bitcoin was the first cryptocurrency to use blockchain technology. Instead of trusting a bank with your money, you trust the blockchain network. Transactions are verified by the network rather than a central authority.</p>

<h2>Beyond Cryptocurrency</h2>
<p>Blockchain has applications beyond Bitcoin. It can track supply chains, verify digital art ownership (NFTs), store medical records securely, and manage smart contracts that execute automatically when conditions are met.</p>` },
      6: { title: 'How the Internet Works: From Click to Content', category: 'tech', date: 'May 9, 2025', readTime: '7 min', image: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80', content: `<h2>The Journey of Data</h2>
<p>When you click a link, your request doesn't travel as one big file. Instead, it's broken into tiny pieces called packets. Each packet contains a destination address (like an envelope) and travels independently through the internet.</p>

<h2>IP Addresses and Domain Names</h2>
<p>Every device connected to the internet has an IP address (Internet Protocol address) - like a house address. Domain names (google.com, wikipedia.org) are human-friendly translations of these IP addresses. DNS (Domain Name System) servers translate domain names into IP addresses.</p>

<h2>The Cloud Explained</h2>
<p>The "cloud" isn't magical - it's just someone else's computer. When you use Gmail or store files on Google Drive, your data is stored on servers owned by Google. These servers are in data centers around the world, connected to the internet.</p>

<h2>Servers and Clients</h2>
<p>Your computer is a client. When you request a webpage, you're asking a server (a powerful computer) to send you data. The server processes your request and sends back the webpage, images, and other content.</p>

<h2>Bandwidth and Speed</h2>
<p>Internet speed depends on bandwidth - how much data can travel through a connection per second. Fiber optic cables are fastest because they use light to transmit data. Your WiFi is slower because radio signals are affected by obstacles and distance.</p>` },
      7: { title: 'Ancient Egypt: Pharaohs and Pyramids', category: 'history', date: 'May 8, 2025', readTime: '9 min', image: 'https://images.unsplash.com/photo-1539768942893-daf3538e70c0?w=900&q=80', content: `<h2>The Age of Pharaohs</h2>
<p>Ancient Egypt flourished for over 3,000 years (roughly 3100 BCE to 30 BCE). Pharaohs were divine rulers - Egyptians believed they were gods walking on earth. They commanded armies, made laws, and oversaw massive construction projects.</p>

<h2>The Pyramids: Engineering Marvels</h2>
<p>The Great Pyramid of Giza, built around 2560 BCE, is one of the Seven Wonders of the Ancient World. It was built using 2.3 million stone blocks, each weighing 2-15 tons. Researchers still debate exactly how the Egyptians built it - but it was definitely without modern machinery.</p>

<h2>The Purpose of Pyramids</h2>
<p>Pyramids weren't monuments to vanity - they were tombs for pharaohs and storehouses for the afterlife. Egyptians believed in resurrection. They filled pyramids with treasures, food, and tools the pharaoh would need in the next life.</p>

<h2>Hieroglyphics: Ancient Writing</h2>
<p>Egyptians invented one of the earliest writing systems using hieroglyphics - symbols representing sounds and objects. A "skilled scribe" was one of the most respected professions. The Rosetta Stone helped modern scholars decode this ancient language.</p>

<h2>Daily Life in Ancient Egypt</h2>
<p>Most Egyptians were farmers who depended on the Nile River's floods for irrigation. Society was stratified: pharaohs and nobles at the top, then priests and scribes, then craftsmen and farmers, with slaves at the bottom.</p>` },
      8: { title: 'Philosophy 101: Big Questions About Life', category: 'culture', date: 'May 7, 2025', readTime: '8 min', image: 'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=900&q=80', content: `<h2>What is Philosophy?</h2>
<p>Philosophy comes from Greek words meaning "love of wisdom." Philosophers ask fundamental questions about existence, knowledge, morality, and reality. These aren't questions with simple answers - they've been debated for thousands of years.</p>

<h2>The Ancient Greek Philosophers</h2>
<p>Socrates believed the key to wisdom was admitting what you don't know. Plato explored the nature of reality and truth. Aristotle studied logic and the natural world. Their ideas still influence how we think today.</p>

<h2>Existentialism: What's the Point?</h2>
<p>Existentialists ask: What is the meaning of life? Their answer: life has no predetermined meaning. YOU create your meaning through your choices and actions. This can be liberating - you're free to define your own purpose.</p>

<h2>Ethics: How Should We Live?</h2>
<p>Ethics explores morality. Should we follow rules (deontology)? Should we aim for the greatest happiness for the greatest number (utilitarianism)? Should we develop virtuous character (virtue ethics)? Different philosophers give different answers.</p>

<h2>Epistemology: What Can We Know?</h2>
<p>Epistemology asks: How do we know what we know? Can we trust our senses? Is knowledge based on experience or reason? These questions led to science and the scientific method.</p>` },
      9: { title: 'The Art of Storytelling: Why Humans Love Stories', category: 'culture', date: 'May 6, 2025', readTime: '6 min', image: 'https://images.unsplash.com/photo-1455390582262-044cdead277a?w=900&q=80', content: `<h2>Stories Are Universal</h2>
<p>Every culture has stories. From ancient cave paintings to modern Netflix shows, humans have always told stories. Stories are one of humanity's greatest inventions because they allow us to share experiences and knowledge across time and space.</p>

<h2>The Brain on Stories</h2>
<p>When you read or hear a story, multiple parts of your brain activate - not just language centers, but also sensory and motor cortex areas. If a story mentions running, your brain's movement areas light up as if you're running. Stories literally transport you into other worlds.</p>

<h2>Why Stories Matter</h2>
<p>Stories help us understand complex ideas. A history textbook lists facts, but a historical novel makes you FEEL what it was like to live during that time. Stories create empathy - they help us understand people different from ourselves.</p>

<h2>The Hero's Journey</h2>
<p>Many stories follow a pattern: an ordinary character faces a challenge, overcomes obstacles, and grows. This template appears in The Odyssey, The Lord of the Rings, Star Wars, and countless other stories. It resonates because it mirrors our own life journeys.</p>

<h2>From Campfires to Streaming</h2>
<p>Stories have evolved from oral traditions around campfires to books, films, podcasts, and interactive games. But the essence remains the same: storytelling connects us as humans and helps us make sense of the world.</p>` },

          headers: {
            'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,

    async function trackView(id) {

        };

        // Try fallback local db
        article = articlesDb[id] || null;
      }

      // Not found — show 404
      if (!article) { showNotFound(); return; }

      // Track view
      trackView(id);
      currentArticle = article;
      articleData = article; // store for lang toggle
      document.getElementById('article-title').textContent = article.title;
      document.getElementById('article-category').textContent = article.category;
      document.getElementById('article-date').textContent = article.date;
      const img = document.getElementById('article-image');
      img.src = article.image; img.alt = article.title;
      document.getElementById('article-content').innerHTML = article.content;
      document.title = article.title + ' — BASIRA';
      // Show lang toggle if Arabic translation exists
      if (article.title_ar && article.content_ar) {
        const btn = document.getElementById('lang-toggle-btn');
        if (btn) btn.classList.remove('hidden');
      }
      document.querySelector('meta[name="description"]').setAttribute('content', article.excerpt || article.title);
      // Update og tags dynamically
      document.querySelector('meta[property="og:title"]').setAttribute('content', article.title + ' — BASIRA');
      document.querySelector('meta[property="og:description"]').setAttribute('content', article.excerpt || article.title);
      const ogImg = document.querySelector('meta[property="og:image"]');
      if (ogImg) ogImg.setAttribute('content', article.image);
      else {
        const m = document.createElement('meta');
        m.setAttribute('property', 'og:image');
        m.setAttribute('content', article.image);
        document.head.appendChild(m);
      }
      // Canonical URL
      const canon = document.querySelector('link[rel="canonical"]') || document.createElement('link');
      canon.rel = 'canonical';
      canon.href = window.location.origin + window.location.pathname + '?id=' + article.id;

      // Hide skeleton, show article
      const skeleton = document.getElementById('article-skeleton');
      const main = document.getElementById('article-main');
      if (skeleton) skeleton.style.display = 'none';
      if (main) main.classList.remove('hidden');
      loadReactions(); loadComments(); loadRelated();

    function initProgressBar() {
      const bar = document.getElementById('read-progress');
      if (!bar) return;
      window.addEventListener('scroll', () => {
        const doc = document.documentElement;
        const pct = (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
        bar.style.width = Math.min(100, pct) + '%';
      });
    }

    async function loadReactions() {
      const id = getArticleId();
      const data = await sbGet(`reactions?article_id=eq.${id}&select=type`);
      if (data) {
        document.getElementById('like-count').textContent = data.filter(r=>r.type==='like').length;
        document.getElementById('dislike-count').textContent = data.filter(r=>r.type==='dislike').length;
      }
      // Restore user's previous reaction from localStorage
      const saved = localStorage.getItem(`basira-reaction-${id}`);
      if (saved) {
        userReaction = saved;
        document.getElementById('btn-like').classList.toggle('liked', saved==='like');
        document.getElementById('btn-dislike').classList.toggle('disliked', saved==='dislike');
      }
    }

    async function react(type) {
      const id = String(getArticleId());
      const lb = document.getElementById('btn-like');
      const db = document.getElementById('btn-dislike');
      const storageKey = `basira-reaction-${id}`;
      const prevReaction = localStorage.getItem(storageKey);

      if (prevReaction === type) {
        // DELETE reaction from Supabase
        try {
          await fetch(`${SB_URL}/rest/v1/reactions?article_id=eq.${id}&type=eq.${type}`, {
            method: 'DELETE',
            headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
          });
        } catch(e) {}
        userReaction = null;
        lb.classList.remove('liked');
        db.classList.remove('disliked');
        localStorage.removeItem(storageKey);
        showToast('Reaction removed', 'minus-circle');
      } else {
        // Remove old reaction first if existed
        if (prevReaction) {
          try {
            await fetch(`${SB_URL}/rest/v1/reactions?article_id=eq.${id}&type=eq.${prevReaction}`, {
              method: 'DELETE',
              headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
            });
          } catch(e) {}
        }
        // INSERT new reaction
        userReaction = type;
        lb.classList.toggle('liked', type === 'like');
        db.classList.toggle('disliked', type === 'dislike');
        localStorage.setItem(storageKey, type);
        await sbPost('reactions', { article_id: id, type: type, session_id: getSessionId() });
        showToast(type === 'like' ? 'Thanks! ❤️' : 'Feedback noted', type === 'like' ? 'heart' : 'frown');
      }
      loadReactions();
    }

    }

    function toggleComment() {
      const box = document.getElementById('comment-area');
      box.classList.toggle('open');
      if (box.classList.contains('open')) document.getElementById('comment-input').focus();
    }

    async function submitComment() {
      const input  = document.getElementById('comment-input');
      const nameEl = document.getElementById('comment-name');
      const text   = input.value.trim();
      const author = (nameEl ? nameEl.value.trim() : '') || 'Reader';
      if (!text) { showToast('Please write something first','alert-circle'); return; }
      const sid = getSessionId();
      const result = await sbPost('comments', {
        article_id: String(getArticleId()),
        content: text,
        author: author,
        session_id: sid
      });
      if (result) {
        input.value = '';
        if (nameEl) nameEl.value = '';
        loadComments();
        showToast('Comment posted!','check-circle');
      } else showToast('Error posting comment','alert-circle');
    }

    async function deleteComment(commentId) {
      if (!confirm('Delete your comment?')) return;
      const ok = await sbDelete(`comments?id=eq.${commentId}&session_id=eq.${getSessionId()}`);
      if (ok) { loadComments(); showToast('Comment deleted','trash-2'); }
      else showToast('Could not delete comment','alert-circle');
    }

    function openSources() {
      if (!currentArticle) return;
      const sources = currentArticle.sources || [];
      const list = document.getElementById('sources-list');
      if (sources.length===0) {
        list.innerHTML='<p class="text-[13px] dark:text-platinum/40 text-obsidian-500">No sources listed.</p>';
      } else {
        list.innerHTML = sources.map((s,i)=>`
          <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="flex items-start gap-3 p-4 rounded-xl dark:bg-white/[0.03] bg-obsidian-800/[0.03] border dark:border-white/[0.06] border-obsidian-800/[0.06] hover:dark:bg-white/[0.06] hover:bg-obsidian-800/[0.06] transition-all duration-200 group">
            <span class="flex-shrink-0 w-6 h-6 rounded-md dark:bg-platinum/10 bg-obsidian-800/5 flex items-center justify-center text-[10px] font-bold dark:text-platinum/60 text-obsidian-500">${i+1}</span>
            <div><p class="text-[13px] font-medium dark:text-platinum/80 text-obsidian-700 group-hover:dark:text-white transition-colors">${s.title}</p>
            <p class="text-[11px] dark:text-platinum/30 text-obsidian-400 mt-0.5 break-all">${s.url}</p></div>
          </a>`).join('');
      }
      document.getElementById('sources-modal').classList.remove('hidden');
    }

    function closeSources(e) {
      if (e.target.id==='sources-modal') document.getElementById('sources-modal').classList.add('hidden');
    }

    function shareArticle(platform) {
      const url = window.location.href;
      const title = currentArticle?.title || document.getElementById('article-title').textContent;
      if (platform==='copy') navigator.clipboard.writeText(url).then(()=>showToast('Link copied!','check-circle'));
      else if (platform==='whatsapp') window.open(`https://wa.me/?text=${encodeURIComponent(title+'\n'+url)}`,'_blank');
      else if (platform==='twitter') window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`,'_blank');
    }

    async function loadRelated() {
      if (!currentArticle) return;
      const id = String(getArticleId());
      const section = document.getElementById('related-section');
      const grid    = document.getElementById('related-grid');
      if (!section || !grid) return;

      let articles = [];

      // Try Supabase only — no fallback to avoid self-article
      const data = await sbGet(`articles?category=eq.${currentArticle.category}&status=eq.published&id=neq.${id}`, 3);
      if (data && data.length > 0) {
        articles = data.map(a => ({
          id: a.id, title: a.title, category: a.category,
          image: a.image || '', excerpt: a.excerpt || ''
        }));
      }

      if (articles.length === 0) { section.classList.add('hidden'); return; }
      section.classList.remove('hidden');

      // If all results are self, hide the section
      const nonSelf = articles.filter(a => String(a.id) !== String(id));
      if (nonSelf.length === 0) { section.classList.add('hidden'); return; }

      grid.innerHTML = nonSelf.map(a => `
        <a href="article.html?id=${a.id}" class="group flex gap-4 p-4 rounded-xl dark:bg-white/[0.03] bg-obsidian-800/[0.03] border dark:border-white/[0.06] border-obsidian-800/[0.06] hover:dark:bg-white/[0.06] hover:bg-obsidian-800/[0.06] transition-all duration-200">
          <div class="w-16 h-16 rounded-lg overflow-hidden flex-shrink-0 dark:bg-obsidian-700 bg-gray-100">
            <img src="${a.image}" alt="${a.title}" class="w-full h-full object-cover dark:brightness-75" onerror="this.style.display='none'">
          </div>
          <div class="flex-1 min-w-0">
            <span class="text-[9px] tracking-widest uppercase dark:text-platinum/40 text-obsidian-400">${a.category}</span>
            <p class="text-[13px] font-semibold dark:text-platinum/80 text-obsidian-700 mt-0.5 line-clamp-2 group-hover:dark:text-white transition-colors">${a.title}</p>
          </div>
        </a>`).join('');
      lucide.createIcons({ nodes: [grid] });
    }

    function toggleLanguage() {
      const html = document.documentElement;
      const btn = document.getElementById('langBtn');
      if (currentLang === 'en') {
        currentLang = 'ar';
        html.setAttribute('dir', 'rtl');
        html.setAttribute('lang', 'ar');
        btn.textContent = 'English';
        document.querySelectorAll('[data-ar]').forEach(el => {
          el.textContent = el.getAttribute('data-ar');
        });
        showToast('تم التبديل إلى العربية', 'languages');
      } else {
        currentLang = 'en';
        html.setAttribute('dir', 'ltr');
        html.setAttribute('lang', 'en');
        btn.textContent = 'العربية';
        document.querySelectorAll('[data-en]').forEach(el => {
          el.textContent = el.getAttribute('data-en');
        });
        showToast('Switched to English', 'languages');
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      html.classList.add('theme-transition');
      const thumb = document.querySelector('.toggle-thumb');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        thumb.classList.remove('translate-x-[24px]');
        thumb.classList.add('translate-x-0');
        showToast('Light mode enabled', 'sun');
        localStorage.setItem('basira-theme', 'light');
      } else {
        html.classList.add('dark');
        thumb.classList.remove('translate-x-0');
        thumb.classList.add('translate-x-[24px]');
        showToast('Dark mode enabled', 'moon');
        localStorage.setItem('basira-theme', 'dark');
      }
      setTimeout(() => lucide.createIcons(), 60);
      setTimeout(() => html.classList.remove('theme-transition'), 600);
    }

    function toggleMobile() {
      const menu = document.getElementById('mobile-menu');
      const btn = document.getElementById('mobile-btn');
      const isOpen = !menu.classList.contains('hidden');
      menu.classList.toggle('hidden');
      if (!isOpen) {
        btn.innerHTML = '<i data-lucide="x" class="w-5 h-5 dark:text-platinum/60 text-obsidian-500"></i>';
      } else {
        btn.innerHTML = '<i data-lucide="menu" class="w-5 h-5 dark:text-platinum/60 text-obsidian-500"></i>';
      }
      lucide.createIcons();
    }

    // shareArticle defined above

    function showToast(message, icon) {
      const container = document.getElementById('toast-box');
      const toast = document.createElement('div');
      toast.className = 'toast-in pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-xl dark:bg-obsidian-700/90 bg-white/90 header-blur shadow-2xl border dark:border-white/[0.06] border-obsidian-800/[0.06] min-w-[220px]';
      toast.innerHTML = `
        <div class="w-6 h-6 rounded-md dark:bg-platinum/10 bg-obsidian-800/5 flex items-center justify-center flex-shrink-0">
          <i data-lucide="${icon}" class="w-3 h-3 dark:text-platinum/70 text-obsidian-600"></i>
        </div>
        <span class="text-[12px] font-medium dark:text-platinum/80 text-obsidian-700">${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons({ nodes: [toast] });
      setTimeout(() => {
        toast.classList.remove('toast-in');
        toast.classList.add('toast-out');
        setTimeout(() => toast.remove(), 300);
      }, 2200);
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('basira-theme') === 'light') {
        document.documentElement.classList.remove('dark');
        const thumb = document.querySelector('.toggle-thumb');
        if (thumb) { thumb.classList.remove('translate-x-[24px]'); thumb.classList.add('translate-x-0'); }
      }
      initProgressBar();
      loadArticle();
      lucide.createIcons();
      setTimeout(() => document.querySelectorAll('.anim-fade').forEach(el => el.classList.add('visible')), 200);

      // Back to top visibility
      window.addEventListener('scroll', () => {
        const btn = document.getElementById('back-to-top');
        if (btn) btn.classList.toggle('visible', window.scrollY > 400);
      });
    });

  </script>

</body>
</html>
